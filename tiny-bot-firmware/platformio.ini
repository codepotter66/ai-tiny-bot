; ============================================================
; TinyBot Firmware - PlatformIO 项目配置文件
; ============================================================
; 描述: ai-tiny-bot 陪伴机器人的 ESP32 固件
; 硬件: ESP32 Dev Module + SSD1306 OLED + MS4030 麦克风 + MAX98357 功放
; ============================================================

[platformio]
default_envs = blink

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 115200
upload_port = /dev/cu.usbserial-10
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5
    adafruit/Adafruit GFX Library @ ^1.11
    links2004/WebSockets @ ^2.3.6
    bblanchon/ArduinoJson @ ^7.0.4
build_flags =
    -DCORE_DEBUG_LEVEL=0
board_build.filesystem = littlefs
board_build.partitions = default.csv

; ============================================================
; 分阶段测试环境
; ============================================================

[env:blink]
extends = env:esp32dev
build_src_filter = +<step1_blink.cpp>

[env:oled]
extends = env:esp32dev
build_src_filter = +<step2_oled.cpp>

[env:audio]
extends = env:esp32dev
build_src_filter = +<step3_audio.cpp>

[env:main]
extends = env:esp32dev
build_src_filter = +<main.cpp> +<cloud_client.cpp> +<oled_face.cpp>